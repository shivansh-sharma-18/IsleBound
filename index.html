<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IsleBound</title>

    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/main.js"></script>
  </head>

  <body>
    <div id="mainMenu" class="menu-screen">
      <div class="top-bar">
        <div id="playerIndicator" class="top-hud-left">
          <span id="playerNameDisplay">GUEST</span>
        </div>
        <div id="authControls" class="top-hud-right">
          <button id="loginMenuButton" class="hud-btn">LOGIN</button>
          <button id="signupMenuButton" class="hud-btn">SIGN UP</button>
          <button id="logoutMenuButton" class="hud-btn hidden">LOGOUT</button>
        </div>
      </div>

      <h1>ISLEBOUND</h1>

      <button id="playButton">PLAY GAME</button>
      <button id="profileButton">PLAYER PROFILE</button>
      <button id="controlsButton">CONTROLS</button>
      <button id="creditsButton">CREDITS</button>
    </div>

    <div id="controlsScreen" class="menu-screen hidden">
      <h2>CONTROLS</h2>

      <div class="controls-list">
        <p><span>WASD / Arrow Keys</span> → Move</p>
        <p><span>Mouse</span> → Aim</p>
        <p><span>Left Click</span> → Shoot</p>
        <p><span>E</span> → Interact / Gather</p>
        <p><span>C</span> → Crafting</p>
        <p><span>B</span> → Craft Boat</p>
        <p><span>P</span> → Pause</p>
      </div>

      <button id="controlsBackButton">BACK</button>
    </div>

    <div id="creditsScreen" class="menu-screen hidden">
      <h2>CREDITS</h2>

      <div class="credits-content">
        <p class="game-title">ISLEBOUND</p>
        <p>Developed by Shivansh Sharma</p>
        <p>HTML5 Canvas</p>
        <p>CSS</p>
        <p>JavaScript</p>
      </div>

      <button id="creditsBackButton">BACK</button>
    </div>

    <div id="pauseScreen" class="menu-screen overlay-screen hidden">
      <h2>PAUSED</h2>

      <button id="resumeButton">RESUME</button>
      <button id="pauseControlsButton">CONTROLS</button>
      <button id="pauseMainMenuButton">MAIN MENU</button>
    </div>

    <div id="deathScreen" class="menu-screen overlay-screen hidden">
      <h2 class="death-title">YOU DIED</h2>

      <button id="restartButton">RESTART</button>
      <button id="deathMainMenuButton">MAIN MENU</button>
    </div>

    <div id="victoryScreen" class="menu-screen overlay-screen hidden">
      <h1 class="victory-title">YOU WIN!</h1>
      <p class="victory-subtitle">YOU CONQUERED ISLEBOUND &amp; ESCAPED</p>

      <div id="victoryStats" class="victory-stats"></div>

      <button id="victoryMainMenuButton">MAIN MENU</button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </body>
</html>
